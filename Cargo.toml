[package]
name = "sixbsixt-discord-bot"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "Discord automation and moderation bot for 6b6t"

[dependencies]
anyhow = "1.0.100"
base64 = "0.23.0"
chrono = "0.4.42"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
futures = "0.3.31"
google-youtube3 = { version = "7.0.0", default-features = false, features = ["ring"] }
hex = "0.4.3"
html-escape = "0.2.13"
poise = "0.6.2"
redis = { version = "1.5", default-features = false, features = ["tokio-comp", "connection-manager"] }
regex = "1.12.2"
reqwest = { version = "0.13.4", default-features = false, features = ["brotli", "gzip", "http2", "json", "query", "rustls"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "derive", "mysql", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
